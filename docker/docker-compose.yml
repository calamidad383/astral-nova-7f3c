services:
  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    ports:
      - "8000:8000"
    env_file: ../.env
    volumes:
      - ../data:/app/data
    restart: unless-stopped

  bot:
    build:
      context: ..
      dockerfile: docker/bot.Dockerfile
    env_file: ../.env
    volumes:
      - ../data:/app/data
    restart: unless-stopped
    depends_on:
      - api
