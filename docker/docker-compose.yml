services:
  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    ports:
      - "8000:8000"
    env_file: ../.env
    volumes:
      - ../data:/app/data
    restart: unless-stopped

  bot:
    build:
      context: ..
      dockerfile: docker/bot.Dockerfile
    env_file: ../.env
    volumes:
      - ../data:/app/data
    restart: unless-stopped
    depends_on:
      - api

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../app:/srv/app:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      - api

volumes:
  caddy_data:
  caddy_config:
