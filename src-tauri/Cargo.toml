[package]
name = "nexo-panel"
version = "0.2.6"
description = "NEXO — Panel de control de la Plataforma IA para Discord"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "nexo_panel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
