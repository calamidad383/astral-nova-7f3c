name: releases

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  escritorio:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Dependencias de Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev
      - name: Instalar tauri-cli
        run: cargo install tauri-cli --version "^2" --locked
      - name: Generar iconos de plataforma
        run: cargo tauri icon src-tauri/icons/icon.png
      - name: Compilar y publicar
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
          tagName: ${{ github.ref_name }}
          releaseName: "NEXO Panel ${{ github.ref_name }}"
          releaseDraft: false
          args: --target ${{ matrix.target }}

  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Verificar SDK de Android preinstalado
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/ndk" 2>/dev/null || (echo "NDK no presente, instalando…" && "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;26.1.10909125")
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: Instalar tauri-cli
        run: cargo install tauri-cli --version "^2" --locked
      - name: Generar iconos de plataforma
        run: cargo tauri icon src-tauri/icons/icon.png
      - name: Iniciar proyecto Android
        run: cargo tauri android init
      - name: Compilar APK universal (todas las arquitecturas)
        run: cargo tauri android build --apk
      - name: Firmar APK
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "Build tools: $BUILD_TOOLS"
          APK=$(ls src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk | head -1)
          "$BUILD_TOOLS/zipalign" -f 4 "$APK" apk-alineado.apk
          "$BUILD_TOOLS/apksigner" sign --ks scripts/nexo-firma.p12 --ks-type PKCS12 --ks-key-alias nexo --ks-pass pass:nexo2026 --key-pass pass:nexo2026 --out NEXO-Panel.apk apk-alineado.apk
          "$BUILD_TOOLS/apksigner" verify NEXO-Panel.apk
          echo "APK firmado y verificado"
      - name: Publicar APK en la release
        uses: softprops/action-gh-release@v2
        with:
          files: NEXO-Panel.apk
