<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXO — Conectando…</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="centro">
<main class="tarjeta" style="max-width: 520px;">
  <h1 id="titulo">Conectando con Discord…</h1>
  <p id="mensaje">Espera un momento.</p>
  <div id="zona-codigo" class="oculto">
    <p>Tu <strong>código de acceso</strong> (cópialo y pégalo en la app NEXO en tu teléfono):</p>
    <textarea id="token" readonly rows="3" style="width:100%"></textarea>
    <button id="btn-copiar" class="boton principal">Copiar código de acceso</button>
    <p class="nota">Si estás en el navegador (PWA), tu sesión ya quedó guardada: <a href="./">volver al panel</a>.</p>
  </div>
</main>
<script>
(async () => {
  const params = new URLSearchParams(location.search);
  const API = params.get("state") || localStorage.getItem("api_url") || "http://localhost:8000";
  const codigo = params.get("code");
  const titulo = document.getElementById("titulo");
  const mensaje = document.getElementById("mensaje");
  if (!codigo) {
    titulo.textContent = "Falta el código de Discord";
    mensaje.textContent = "Vuelve a la app y pulsa de nuevo Iniciar sesión.";
    return;
  }
  try {
    const r = await fetch(API + "/auth/discord", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ codigo, redirect_uri: location.origin + "/callback.html" }),
    });
    if (!r.ok) throw new Error(await r.text());
    const datos = await r.json();
    localStorage.setItem("token", datos.token);
    titulo.textContent = "¡Sesión iniciada como " + datos.usuario.username + "!";
    mensaje.textContent = "En la PWA ya entraste. En la app del teléfono, copia el código de acceso y pégalo.";
    document.getElementById("token").value = datos.token;
    document.getElementById("zona-codigo").classList.remove("oculto");
  } catch (e) {
    titulo.textContent = "No se pudo completar el login";
    mensaje.textContent = "Detalle: " + e.message;
  }
})();
document.getElementById("btn-copiar").addEventListener("click", async () => {
  const campo = document.getElementById("token");
  campo.select();
  try { await navigator.clipboard.writeText(campo.value); } catch { document.execCommand("copy"); }
});
</script>
</body>
</html>
