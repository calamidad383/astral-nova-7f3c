<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXO — Conectando…</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="centro">
<main class="tarjeta" style="max-width: 520px;">
  <h1 id="titulo">Conectando con Discord…</h1>
  <p id="mensaje">Espera un momento.</p>
  <div id="zona-codigo" class="oculto">
    <p>Tu <strong>código de acceso</strong> (cópialo y pégalo en la app NEXO en tu teléfono, en «Entrar con código»):</p>
    <textarea id="token" readonly rows="3" style="width:100%"></textarea>
    <button id="btn-copiar" class="boton principal">Copiar código de acceso</button>
    <p class="nota">Si estás en el navegador (PWA), tu sesión ya quedó guardada: <a href="./">volver al panel</a>.</p>
  </div>
</main>
<script>
(async () => {
  const titulo = document.getElementById("titulo");
  const mensaje = document.getElementById("mensaje");

  const fragmento = new URLSearchParams(location.hash.startsWith("#") ? location.hash.slice(1) : location.hash);
  const token = fragmento.get("access_token");

  if (!token) {
    titulo.textContent = "Falta la sesión de Discord";
    mensaje.textContent = "Vuelve a la app y pulsa de nuevo «Iniciar sesión con Discord».";
    return;
  }

  try {
    const r = await fetch("https://discord.com/api/v10/users/@me", {
      headers: { "Authorization": "Bearer " + token },
    });
    if (!r.ok) throw new Error("Discord respondió " + r.status);
    const usuario = await r.json();

    try { localStorage.setItem("token", token); } catch {}

    titulo.textContent = "¡Sesión iniciada como " + (usuario.global_name || usuario.username) + "!";
    mensaje.textContent = "En la PWA ya entraste. En la app del teléfono, copia el código de abajo y pégalo en «Entrar con código».";
    document.getElementById("token").value = token;
    document.getElementById("zona-codigo").classList.remove("oculto");
  } catch (e) {
    titulo.textContent = "No se pudo completar el login";
    mensaje.textContent = "Detalle: " + e.message;
  }
})();
document.getElementById("btn-copiar").addEventListener("click", async () => {
  const campo = document.getElementById("token");
  campo.select();
  try { await navigator.clipboard.writeText(campo.value); } catch { document.execCommand("copy"); }
});
</script>
</body>
</html>
